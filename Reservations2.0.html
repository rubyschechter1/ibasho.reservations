<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reservations</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ece9;--card:#f6f8f6;--ink:#1c2f2a;--mute:#5d6f69;--line:#c3cdc8;--free:#1f5c4d;--free-bg:#e1efe9;--res:#b9781c;--res-bg:#f6e3c2;--arr:#6b7a85;--arr-bg:#dde3e7;--sel:#2f5fd0;--sel-bg:#dbe5fb;--err:#a8321f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141c1a;--card:#1d2825;--ink:#e6eeea;--mute:#93a59f;--line:#34453f;--free:#6fd0b4;--free-bg:#1b3a32;--res:#e8a84a;--res-bg:#4a3716;--arr:#9fb0bb;--arr-bg:#2b363d;--sel:#7ea3ff;--sel-bg:#1f2f5c;--err:#ff8d78}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141c1a;--card:#1d2825;--ink:#e6eeea;--mute:#93a59f;--line:#34453f;--free:#6fd0b4;--free-bg:#1b3a32;--res:#e8a84a;--res-bg:#4a3716;--arr:#9fb0bb;--arr-bg:#2b363d;--sel:#7ea3ff;--sel-bg:#1f2f5c;--err:#ff8d78}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Instrument Sans",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:Fraunces,Georgia,serif;margin:0;font-weight:700}
h1{font-size:28px}h2{font-size:22px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.date{display:flex;gap:6px;align-items:center}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 12px}
button:hover{border-color:var(--free)}
button.primary{background:var(--free);color:var(--bg);border-color:var(--free);font-weight:600}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.msg{margin-top:12px;min-height:22px;font-weight:500}
.msg.ok{color:var(--free)}.msg.bad{color:var(--err)}.msg.hint{color:var(--mute);font-weight:400}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
@media(max-width:480px){.panels{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel.active{border-color:var(--sel)}
.ph{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.stats{color:var(--mute);font-size:13px;margin-bottom:14px}
.stats b{color:var(--ink)}
.bar{display:flex;gap:8px;justify-content:center;padding:10px;border:1px dashed var(--line);border-radius:40px;margin-bottom:16px}
.bar-label,.zone{font-size:12px;color:var(--mute);text-align:center;margin:0 0 6px}
.floor{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.seat,.tbl{border:2px solid var(--free);background:var(--free-bg);color:var(--free);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px;line-height:1.2;font-size:12px;overflow:hidden}
.seat{width:44px;height:44px;border-radius:50%}
.tbl{aspect-ratio:1;border-radius:12px}
.tbl.big{grid-column:1/-1;aspect-ratio:auto;height:78px}
.tbl b,.seat b{font-size:14px}
.reserved{border-color:var(--res);background:var(--res-bg);color:var(--res)}
.arrived{border-color:var(--arr);background:var(--arr-bg);color:var(--arr)}
.selected{border-color:var(--sel);background:var(--sel-bg);color:var(--sel)}
.hl{outline:3px solid var(--sel)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:16px 0 8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid;margin-right:5px;vertical-align:-2px}
.list{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mute);font-weight:500;font-size:13px}
tr.hl td{background:var(--sel-bg)}
tr.arrived td{color:var(--arr)}
.empty{color:var(--mute);padding:8px 0}
.settings{margin-top:12px;font-size:13px;color:var(--mute);display:flex;gap:8px;align-items:center}
.settings input{width:auto}
</style>
</head>
<body>
<main>
<header>
  <h1>Reservations</h1>
  <div class="date">
    <button id="prev" aria-label="Previous day">‹</button>
    <input type="date" id="date" aria-label="Date">
    <button id="next" aria-label="Next day">›</button>
    <button id="today">Today</button>
  </div>
</header>

<section class="form" aria-label="New reservation">
  <div class="fields">
    <div><label for="party">Guests</label><input id="party" type="number" min="1" max="8" value="2"></div>
    <div><label for="slot">Time</label><select id="slot"><option>18:30</option><option>20:30</option></select></div>
    <div><label for="pref">Seating</label><select id="pref"><option value="auto">Best fit</option><option value="table">Table</option><option value="bar">Bar</option></select></div>
    <div><label for="name">Name</label><input id="name" placeholder="Guest name" autocomplete="off"></div>
    <div><label for="phone">Phone (optional)</label><input id="phone" type="tel" autocomplete="off"></div>
    <div><button class="primary" id="book" style="width:100%">Book</button></div>
  </div>
  <div class="msg hint" id="msg" role="status"></div>
  <div class="settings" style="display:none"><input type="checkbox" id="overlap"><label for="overlap" style="margin:0">A table booked at one time is held for all other times too (one turn per table)</label></div>
</section>

<div class="panels" id="panels"></div>

<div class="legend">
  <span><i style="border-color:var(--free);background:var(--free-bg)"></i>Available</span>
  <span><i style="border-color:var(--res);background:var(--res-bg)"></i>Reserved</span>
  <span><i style="border-color:var(--arr);background:var(--arr-bg)"></i>Arrived</span>
  <span><i style="border-color:var(--sel);background:var(--sel-bg)"></i>Selected</span>
  <span>Tip: click open tables or stools to choose them yourself.</span>
</div>

<section class="list"><h2 style="margin-bottom:8px">Bookings</h2><div id="list"></div></section>
</main>

<script>
const SLOTS=['18:30','20:30'];
const TABLES=[1,2,3,4,5].map(n=>({id:'T'+n,cap:4,k:'t'})).concat([{id:'T6',cap:8,k:'t'}],[1,2,3,4,5,6].map(n=>({id:'B'+n,cap:1,k:'b'})));
const TOTAL=34;
let S={res:[],overlap:false};
try{const raw=localStorage.getItem('resv-v1');if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
S.overlap=false;
const save=()=>{try{localStorage.setItem('resv-v1',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
let date=iso(new Date()),sel=[],selSlot=null,hl=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const holder=(id,slot)=>S.res.find(r=>r.date===date&&r.ids.includes(id)&&(r.slot===slot||S.overlap));
const isFree=(id,slot)=>!holder(id,slot);
const freeIds=(slot,k)=>TABLES.filter(t=>t.k===k&&isFree(t.id,slot)).map(t=>t.id);

function contiguous(slot,n){
  const bs=TABLES.filter(t=>t.k==='b').map(t=>t.id);
  for(let i=0;i+n<=bs.length;i++){const g=bs.slice(i,i+n);if(g.every(id=>isFree(id,slot)))return g}
  return null;
}
function bestFit(slot,party,pref){
  if(party<1||party>8)return null;
  const fours=freeIds(slot,'t').filter(id=>id!=='T6'),eight=isFree('T6',slot)?['T6']:[];
  const bar=party<=6?contiguous(slot,party):null;
  if(pref==='bar')return bar;
  let order;
  if(party>=5)order=[eight];
  else if(party>=3)order=[fours.slice(0,1),eight];
  else order=pref==='table'?[fours.slice(0,1),eight]:[fours.slice(0,1),bar,eight];
  for(const o of order)if(o&&o.length)return o;
  return null;
}
function validate(ids,party){
  const tb=ids.filter(i=>i[0]==='T'),br=ids.filter(i=>i[0]==='B');
  if(tb.length&&br.length)return'Choose either a table or bar seats, not both.';
  if(tb.length>1)return'Choose one table.';
  if(tb.length){const t=TABLES.find(x=>x.id===tb[0]);if(party>t.cap)return`${t.id} seats ${t.cap}. Pick a larger table.`}
  if(br.length&&br.length!==party)return`Select ${party} bar seat${party>1?'s':''} (you picked ${br.length}).`;
  return null;
}
function say(t,c){const m=$('msg');m.textContent=t;m.className='msg '+(c||'hint')}

function preview(){
  const party=+$('party').value||0,slot=$('slot').value,pref=$('pref').value;
  if(sel.length)return;
  if(party<1)return say('Enter the number of guests.','bad');
  if(party>8)return say('Parties over 8 need a split booking or a call to the restaurant.','bad');
  const f=bestFit(slot,party,pref);
  if(f)return say(`${slot}: ${party} guest${party>1?'s':''} fit at ${f.length>1?'bar seats '+f.join(', '):f[0]}.`,'hint');
  const alt=SLOTS.filter(s=>s!==slot&&bestFit(s,party,pref));
  say(`No availability at ${slot} for ${party}.`+(alt.length?` Open at ${alt.join(', ')}.`:' Nothing open at the other seating either.'),'bad');
}

function book(){
  const party=+$('party').value,slot=$('slot').value,pref=$('pref').value,name=$('name').value.trim();
  if(!name)return say('Add a guest name.','bad');
  if(!(party>=1&&party<=8))return say('Guests must be between 1 and 8.','bad');
  let ids;
  if(sel.length){
    if(selSlot!==slot)return say(`Your selection is for ${selSlot}. Change the time or reselect.`,'bad');
    const err=validate(sel,party);if(err)return say(err,'bad');
    ids=sel.slice();
  }else ids=bestFit(slot,party,pref);
  if(!ids)return preview();
  if(ids.some(id=>!isFree(id,slot)))return say('That spot was just taken.','bad');
  S.res.push({id:Date.now()+''+Math.random().toString(36).slice(2,5),date,slot,name,phone:$('phone').value.trim(),party,ids,arrived:false});
  save();sel=[];selSlot=null;
  $('name').value='';$('phone').value='';
  render();say(`Booked ${name}, ${party} at ${slot} (${ids.join(', ')}).`,'ok');
}

function pick(id,slot){
  if(!isFree(id,slot))return;
  if(selSlot!==slot){sel=[];selSlot=slot}
  $('slot').value=slot;
  if(id[0]==='T')sel=sel.includes(id)?[]:[id];
  else{sel=sel.filter(i=>i[0]==='B');sel=sel.includes(id)?sel.filter(i=>i!==id):sel.concat(id)}
  if(!sel.length)selSlot=null;
  else{const tb=sel.find(i=>i[0]==='T');$('party').value=tb?Math.min(+$('party').value||1,TABLES.find(t=>t.id===tb).cap):sel.length}
  render();
  if(sel.length){const err=validate(sel,+$('party').value);say(err||`Selected ${sel.join(', ')} at ${slot}. Add a name and book.`,err?'bad':'ok')}else preview();
}

function cell(t,slot){
  const r=holder(t.id,slot),isSel=selSlot===slot&&sel.includes(t.id);
  const cls=(t.k==='b'?'seat':'tbl')+(t.id==='T6'?' big':'')+(r?(r.arrived?' arrived':' reserved'):isSel?' selected':'')+(r&&r.id===hl?' hl':'');
  const held=r&&r.slot!==slot;
  const body=r?`<b>${t.id}</b>${t.k==='b'?'':`<span>${esc(r.name)}</span><span>${held?'held · ':''}party of ${r.party}</span>`}`:`<b>${t.id}</b>${t.k==='b'?'':`<span>${t.cap} seats</span>`}`;
  const title=r?`${r.name}, ${r.party} at ${r.slot}`:`${t.id}, ${t.cap===1?'bar seat':t.cap+' seats'}, available`;
  return `<button class="${cls}" data-id="${t.id}" data-slot="${slot}" title="${esc(title)}" aria-label="${esc(title)}">${body}</button>`;
}
function panel(slot){
  const taken=new Set();S.res.filter(r=>r.date===date&&r.slot===slot).forEach(r=>taken.add(r));
  const covers=[...taken].reduce((a,r)=>a+r.party,0);
  const f4=freeIds(slot,'t').filter(i=>i!=='T6').length,f8=isFree('T6',slot),fb=freeIds(slot,'b').length;
  const seatsFree=(f4*4)+(f8?8:0)+fb;
  return `<div class="panel ${$('slot').value===slot?'active':''}"><div class="ph"><h2>${slot}</h2><span class="stats"><b>${covers}</b> guests booked</span></div>
  <div class="stats"><b>${f4}/5</b> four-tops free · eight-top <b>${f8?'free':'taken'}</b> · bar <b>${fb}/6</b> · <b>${seatsFree}/${TOTAL}</b> seats open</div>
  <p class="bar-label">Bar</p><div class="bar">${TABLES.filter(t=>t.k==='b').map(t=>cell(t,slot)).join('')}</div>
  <p class="zone">Dining room</p><div class="floor">${TABLES.filter(t=>t.k==='t'&&t.id!=='T6').map(t=>cell(t,slot)).join('')}${cell(TABLES.find(t=>t.id==='T6'),slot)}</div></div>`;
}
function list(){
  const rows=S.res.filter(r=>r.date===date).sort((a,b)=>a.slot.localeCompare(b.slot)||a.name.localeCompare(b.name));
  if(!rows.length)return $('list').innerHTML='<div class="empty">No bookings for this date yet. Enter guests and a time above.</div>';
  $('list').innerHTML=`<table><thead><tr><th>Time</th><th>Name</th><th>Guests</th><th>Seats</th><th>Phone</th><th></th></tr></thead><tbody>`+rows.map(r=>`<tr data-r="${r.id}" class="${r.arrived?'arrived':''}${r.id===hl?' hl':''}"><td>${r.slot}</td><td>${esc(r.name)}</td><td>${r.party}</td><td>${r.ids.join(', ')}</td><td>${esc(r.phone||'')}</td><td><button data-act="arr" data-id="${r.id}">${r.arrived?'Undo arrived':'Arrived'}</button> <button data-act="del" data-id="${r.id}">Cancel</button></td></tr>`).join('')+`</tbody></table>`;
}
function render(){
  $('date').value=date;$('overlap').checked=S.overlap;
  $('panels').innerHTML=SLOTS.map(panel).join('');
  list();
}

$('panels').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const slot=b.dataset.slot,id=b.dataset.id,r=holder(id,slot);
  if(r){hl=r.id;render();const row=document.querySelector(`tr[data-r="${r.id}"]`);if(row)row.scrollIntoView({block:'center',behavior:'smooth'})}
  else pick(id,slot);
});
$('list').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const r=S.res.find(x=>x.id===b.dataset.id);if(!r)return;
  if(b.dataset.act==='arr')r.arrived=!r.arrived;
  else{if(!confirm(`Cancel ${r.name} (${r.party} at ${r.slot})?`))return;S.res=S.res.filter(x=>x!==r)}
  save();render();preview();
});
const shift=n=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);date=iso(d);sel=[];selSlot=null;render();preview()};
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);
$('today').onclick=()=>{date=iso(new Date());sel=[];selSlot=null;render();preview()};
$('date').onchange=e=>{if(e.target.value){date=e.target.value;sel=[];selSlot=null;render();preview()}};
$('overlap').onchange=e=>{S.overlap=e.target.checked;save();render();preview()};
['party','slot','pref'].forEach(id=>$(id).addEventListener('input',()=>{if(id!=='party'&&sel.length&&selSlot!==$('slot').value){sel=[];selSlot=null}sel.length?0:0;render();preview()}));
$('book').onclick=book;
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')book()});
render();preview();
</script>
</body>
</html>
